name: Build ERA for Windows
on:
  push:
    tags: ["v*"]          # git tag v1.0.0 && git push --tags  -> builds and publishes a download
  workflow_dispatch: {}   # or run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install -r requirements.txt pyinstaller pytest
      - run: python -m playwright install chromium
      - run: python -m pytest tests -q
        continue-on-error: true   # tests are informational: a failing test must not block the download build
      - run: python build_exe.py
      - run: Compress-Archive -Path dist/ERA -DestinationPath ERA-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: ERA-windows, path: ERA-windows.zip }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: ERA-windows.zip }
